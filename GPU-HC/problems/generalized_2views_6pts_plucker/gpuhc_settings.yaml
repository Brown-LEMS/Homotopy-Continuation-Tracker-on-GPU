%YAML:1.0

#> Problem Name (must be the same as the problem folder name)
problem_name: generalized_2views_6pts_plucker
problem_print_out_name: Generalized Two-View Relative Pose Problem using 6 Points in the form of Plucker vectors

#> Reference: 

#> GPU-HC Settings
GPUHC_Type: P2C
GPUHC_Max_Steps: 200
GPUHC_Max_Correction_Steps: 100
GPUHC_Num_Of_Steps_to_Increase_Delta_t: 5

#> Problem spec
Num_Of_Vars: 6
Num_Of_Params: 60
Num_Of_Tracks: 64
dHdx_Max_Terms: 16
dHdx_Max_Parts: 4
dHdt_Max_Terms: 40
dHdt_Max_Parts: 5
Max_Order_Of_T: 2
Num_Of_Coeffs_From_Params: 168

#> RANSAC data
#RANSAC_Dataset: Synthetic / ICL-NUIM
# RANSAC_Dataset: ICL-NUIM
RANSAC_Dataset: None
